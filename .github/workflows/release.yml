name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Full distribution build: operator tier (relay zip, plugin DLLs — what enterprises
    # drop into containers) + consumer tier (self-contained installers with the
    # Doorstop 4.5.0 loader embedded). Also the launcher's update channel.
    #
    # Must run on a SELF-HOSTED Windows runner: the plugin and installer builds reference
    # lib/ (proprietary game DLLs), which scripts/fetch-libs.sh provisions FROM A LOCAL
    # PEAK INSTALL. Cloud runners have no game → the first v0.6.0 attempt failed exactly
    # there. A runner registered on a machine with PEAK installed satisfies this.
    runs-on: [self-hosted, windows]
    # Second service-runner find (after the WSL bash fix): LocalSystem has NO user
    # PowerShell execution policy — the default `powershell -command ". '{0}'"` fails with
    # "running scripts is disabled". Pin a custom shell template that bypasses the policy
    # and uses -File (faithful exit codes: a throw exits 1). Steps that need something
    # else set their own `shell:` (the bash steps do).
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4

      # Self-hosted runners have no admin rights: install the SDK into the job's temp
      # dir instead of C:\Program Files\dotnet (setup-dotnet honors this and PATHs it).
      # Step-level env — the runner context is invalid at workflow level.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet

      # IMPORTANT: shell: bash resolves to WSL bash on Windows, and WSL REFUSES to run
      # as LocalSystem (Bash/WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED) - exactly how the runner
      # service executes (live find: v0.7.6's first release attempt failed there; the
      # interactive v0.7.5 run had masked it). Pin Git Bash explicitly, which works both
      # interactively and as a service.
      - name: Provision lib/ from the local PEAK install (game DLLs + BepInEx)
        shell: cmd
        run: '"C:\\Program Files\\Git\\bin\\bash.exe" --noprofile --norc -e -o pipefail scripts/fetch-libs.sh'

      - name: Build plugins (Release — payload staging copies these DLLs)
        run: |
          dotnet build PeakRelay.Dedicated/PeakRelay.Dedicated.csproj -c Release
          dotnet build PeakRelay.Client/PeakRelay.Client.csproj -c Release

      - name: Stage installer payload (BepInEx, Doorstop, plugin DLLs, relay publish)
        shell: cmd
        run: |
          "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail -c "DOTNET='$(which dotnet)' BUILD_CONFIG=Release bash scripts/prepare-installer-payload.sh"

      - name: Pin the loader (doctor constant must match the shipped winhttp)
        shell: powershell
        run: |
          $sha = (Get-FileHash Installer.Core/Payload/payload/doorstop/winhttp.dll -Algorithm SHA256).Hash.ToLower()
          $expected = '8c6cdbc38836dee87e3368f5de1994d7c0ccebf29e4ce7aba3c0981f9375412c'
          if ($sha -ne $expected) {
            throw "loader sha256 $sha does not match pin $expected - if Doorstop 4.5.0 upstream changed, update Doctor.KnownLoaderSha256"
          }

      - name: Plugins must carry BepInPlugin (attribute regression gate)
        shell: powershell
        run: |
          $bad = @()
          # Only the plugin ENTRY assemblies carry [BepInPlugin]; Protocol.dll is a library.
          Get-ChildItem Installer.Core/Payload/payload/plugins -Recurse -Include PeakRelay.Client.dll, PeakRelay.Dedicated.dll | ForEach-Object {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName))
            if ($text -notmatch 'BepInPlugin') { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) { throw ("plugin DLLs without BepInPlugin attribute: " + ($bad -join ', ')) }

      - name: Build installers (self-contained single-file)
        run: |
          dotnet publish Installer.Server/Installer.Server.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/installers
          dotnet publish Installer.Client/Installer.Client.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/installers
          dotnet publish Launcher/PeakRelay.Launcher.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/installers

      - name: Collect operator artifacts
        shell: powershell
        run: |
          Compress-Archive -Path 'Installer.Core/Payload/payload/relay/*' -DestinationPath PeakRelay.Server.zip -Force
          New-Item -ItemType Directory -Force -Path plugins/PeakRelay.Dedicated, plugins/PeakRelay.Client | Out-Null
          Copy-Item Installer.Core/Payload/payload/plugins/Dedicated/*.dll plugins/PeakRelay.Dedicated/
          Copy-Item Installer.Core/Payload/payload/plugins/Client/*.dll plugins/PeakRelay.Client/
          Compress-Archive -Path plugins -DestinationPath PeakRelay-plugins.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PeakRelay.Server.zip
            PeakRelay-plugins.zip
            dist/installers/PeakRelayInstaller-Server.exe
            dist/installers/PeakRelayInstaller-Client.exe
            dist/installers/PeakRelayLauncher.exe
