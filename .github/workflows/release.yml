name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Full distribution build: operator tier (relay zip, plugin DLLs — what enterprises
    # drop into containers) + consumer tier (self-contained installers with the
    # Doorstop 4.5.0 loader embedded). Also the future launcher's update channel.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stage installer payload (BepInEx, Doorstop, plugin DLLs, relay publish)
        shell: bash
        run: |
          DOTNET="$(which dotnet)" bash scripts/prepare-installer-payload.sh

      - name: Build plugins
        run: |
          dotnet build PeakRelay.Dedicated/PeakRelay.Dedicated.csproj -c Release
          dotnet build PeakRelay.Client/PeakRelay.Client.csproj -c Release

      - name: Build installers (self-contained single-file)
        run: |
          dotnet publish Installer.Server/Installer.Server.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/installers
          dotnet publish Installer.Client/Installer.Client.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist/installers

      - name: Collect operator artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path Installer.Core/Payload/payload/relay -DestinationPath PeakRelay.Server.zip -Force
          New-Item -ItemType Directory -Force -Path plugins/PeakRelay.Dedicated, plugins/PeakRelay.Client | Out-Null
          Copy-Item Installer.Core/Payload/payload/plugins/Dedicated/*.dll plugins/PeakRelay.Dedicated/
          Copy-Item Installer.Core/Payload/payload/plugins/Client/*.dll plugins/PeakRelay.Client/
          Compress-Archive -Path plugins -DestinationPath PeakRelay-plugins.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PeakRelay.Server.zip
            PeakRelay-plugins.zip
            dist/installers/PeakRelayInstaller-Server.exe
            dist/installers/PeakRelayInstaller-Client.exe
